version: 2

updates:
  # One pull request a day with every outdated npm package, into develop like any
  # other change. Dependabot has no setting for the case of "bump": it copies the
  # last Dependabot commit on main, and without one it reads our Co-Authored-By
  # trailers as capitalised subjects and writes "Bump", which pr-title refuses.
  # So a Dependabot PR merged with a lowercase title keeps the next ones lowercase.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-packages:
        patterns: ["*"]
    ignore:
      # @cloudflare/vitest-pool-workers needs vitest ^4 (peer dependency); drop
      # this once a pool release accepts vitest 5.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
