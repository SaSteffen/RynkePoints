name: Setup
description: Install pnpm (from packageManager) and Node (from .nvmrc), then install dependencies from the lockfile.

runs:
  using: composite
  steps:
    # No `version` input: the pnpm version comes from "packageManager" in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # After pnpm, because `cache: pnpm` needs pnpm on the PATH.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # LEFTHOOK=0 keeps the "prepare" script from installing git hooks on the runner.
    # --frozen-lockfile fails the job if pnpm-lock.yaml is out of date.
    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        LEFTHOOK: "0"
