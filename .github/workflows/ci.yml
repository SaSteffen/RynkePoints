name: CI

on:
  pull_request:
    branches: [main, develop]
  # Not develop: it only takes up-to-date pull requests, whose checks already ran on
  # exactly the commit it gets (spec FR-012).
  push:
    branches: [main]
  # Re-deploy: on main it re-runs the checks and deploys the tip of main. No inputs,
  # so a dispatch can't pick a commit (research R16).
  workflow_dispatch:

permissions:
  contents: read

# Outdated PR runs are cancelled. Pushes and dispatches on main always run
# to the end, so runs on main queue one at a time (research R14).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The six check jobs (here and in pr-policy.yml) are the required-check contexts in
# .github/rulesets/*.json. Renaming one means updating both ruleset files in the same
# change. already-checked, deploy-gate and deploy are not contexts and must never be
# added to them.
jobs:
  # On a push to main: checked=true when the merge commit has exactly the content of
  # the merged branch's head and the latest lint, typecheck and test on that head
  # passed, the results the main ruleset accepted for the merge (spec FR-012). Then
  # those three are skipped. Any doubt leaves checked=false.
  already-checked:
    name: already-checked
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      checked: ${{ steps.decide.outputs.checked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          checked=true
          read -r _ _ head extra <<< "$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          if [ -z "${head:-}" ] || [ -n "${extra:-}" ]; then
            checked=false
            echo "$GITHUB_SHA is not a merge of one pull request."
          elif [ "$(git rev-parse "$GITHUB_SHA^{tree}")" != "$(git rev-parse "$head^{tree}")" ]; then
            checked=false
            echo "$GITHUB_SHA has content that $head lacks, e.g. a hotfix not yet merged back."
          else
            for check in lint typecheck test; do
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=$check&filter=latest" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions")][0].conclusion // ""') || conclusion=""
              if [ "$conclusion" != success ]; then
                checked=false
                echo "$check on $head: ${conclusion:-not found}."
              fi
            done
          fi

          if [ "$checked" = true ]; then
            echo "::notice::The checks already passed on $head, which has the same content; not re-running them."
          fi
          echo "checked=$checked" >> "$GITHUB_OUTPUT"

  # !cancelled() lets them run when already-checked is skipped (pull requests,
  # dispatches) or failed.
  lint:
    name: lint
    needs: already-checked
    if: ${{ !cancelled() && needs.already-checked.outputs.checked != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint --reporter=github

  typecheck:
    name: typecheck
    needs: already-checked
    if: ${{ !cancelled() && needs.already-checked.outputs.checked != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    needs: already-checked
    if: ${{ !cancelled() && needs.already-checked.outputs.checked != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Merge commits ("Merge pull request #…", "Merge branch …") are skipped by the
  # config-conventional default ignores, so release and sync PRs need no special case.
  commit-messages:
    name: commit-messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Refuses to deploy a commit older than the live one, e.g. on a re-run of an old
  # run (research R14, contracts/deploy.md). No environment, so a skip records nothing.
  # Runs only after the three checks passed, or were skipped because they already
  # passed on this content (spec FR-024).
  deploy-gate:
    name: deploy-gate
    needs: [already-checked, lint, typecheck, test]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (needs.already-checked.outputs.checked == 'true'
        || (needs.lint.result == 'success' && needs.typecheck.result == 'success' && needs.test.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Newest first. The first one whose newest status is success is live;
          # older successes are inactive, failed ones failure.
          deployments=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=100" --jq '.[] | "\(.id) \(.sha)"')
          live_sha=""
          while read -r id sha; do
            [ -n "$id" ] || continue
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = success ]; then
              live_sha=$sha
              break
            fi
          done <<< "$deployments"

          if [ -z "$live_sha" ]; then
            deploy=true
            echo "First deployment to production."
          elif [ "$live_sha" = "$GITHUB_SHA" ]; then
            deploy=true
            echo "Re-deploying the live commit $live_sha."
          elif git merge-base --is-ancestor "$GITHUB_SHA" "$live_sha"; then
            deploy=false
            echo "::notice::A newer commit ($live_sha) is already deployed; skipping $GITHUB_SHA."
          else
            # 1 means newer; anything else (e.g. 128, unknown commit) is an error.
            rc=$?
            if [ "$rc" -ne 1 ]; then
              exit "$rc"
            fi
            deploy=true
            echo "Deploying $GITHUB_SHA; live is $live_sha."
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # Migrations first, then the code; wrangler deploy stays the last step (research
  # R19–R21). The secret is only in the env of the two wrangler steps (R22).
  deploy:
    name: deploy
    needs: deploy-gate
    if: needs.deploy-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://trhh-rynke-coins.link
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply rynke-points --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --message "$GITHUB_SHA (run $GITHUB_RUN_ID)"
