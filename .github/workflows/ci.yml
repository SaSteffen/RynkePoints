name: CI

on:
  pull_request:
    branches: [main, develop]
  # Not develop: it only takes up-to-date pull requests, whose checks already ran on
  # exactly the commit it gets (spec FR-012).
  push:
    branches: [main]
  # Re-deploy: on main it re-runs the checks and deploys the tip of main. No inputs,
  # so a dispatch can't pick a commit (research R16).
  workflow_dispatch:

permissions:
  contents: read

# Outdated PR runs are cancelled. Pushes and dispatches on main always run
# to the end, so runs on main queue one at a time (research R14).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The seven check jobs (here and in pr-policy.yml) are the required-check contexts in
# .github/rulesets/*.json. Renaming one means updating both ruleset files in the same
# change. already-checked, playwright-image, deploy-gate, deploy and deploy-gateway
# are not contexts and must never be added to them.
jobs:
  # On a push to main: checked=true when the merge commit has exactly the content of
  # the merged branch's head and the latest lint, typecheck, test and e2e on that head
  # passed, the results the main ruleset accepted for the merge (spec FR-012). Then
  # those four are skipped. Any doubt leaves checked=false.
  already-checked:
    name: already-checked
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      checked: ${{ steps.decide.outputs.checked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          checked=true
          read -r _ _ head extra <<< "$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          if [ -z "${head:-}" ] || [ -n "${extra:-}" ]; then
            checked=false
            echo "$GITHUB_SHA is not a merge of one pull request."
          elif [ "$(git rev-parse "$GITHUB_SHA^{tree}")" != "$(git rev-parse "$head^{tree}")" ]; then
            checked=false
            echo "$GITHUB_SHA has content that $head lacks, e.g. a hotfix not yet merged back."
          else
            for check in lint typecheck test e2e; do
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=$check&filter=latest" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions")][0].conclusion // ""') || conclusion=""
              if [ "$conclusion" != success ]; then
                checked=false
                echo "$check on $head: ${conclusion:-not found}."
              fi
            done
          fi

          if [ "$checked" = true ]; then
            echo "::notice::The checks already passed on $head, which has the same content; not re-running them."
          fi
          echo "checked=$checked" >> "$GITHUB_OUTPUT"

  # !cancelled() lets them run when already-checked is skipped (pull requests,
  # dispatches) or failed.
  lint:
    name: lint
    needs: already-checked
    if: ${{ !cancelled() && needs.already-checked.outputs.checked != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint --reporter=github

  typecheck:
    name: typecheck
    needs: already-checked
    if: ${{ !cancelled() && needs.already-checked.outputs.checked != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    needs: already-checked
    if: ${{ !cancelled() && needs.already-checked.outputs.checked != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  # The Playwright image matching the locked @playwright/test, for e2e's container.
  playwright-image:
    name: playwright-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 -oP "^  '@playwright/test@\K[0-9][^']*(?=':)" pnpm-lock.yaml)
          echo "image=mcr.microsoft.com/playwright:v$version-noble" >> "$GITHUB_OUTPUT"

  # Smoke tests in Chromium, Firefox and WebKit against the app in fake mode
  # (synthetic riders, no request leaves the runner). In Playwright's image, which
  # has the browsers and their system libraries: `playwright install --with-deps`
  # spent up to 20 minutes on timeouts from the runner's Ubuntu mirror.
  # On a pull request into develop, Firefox and WebKit run only the @cross-browser
  # tests and the e2e files it adds or changes (scripts/e2e-scope.mjs); Chromium and
  # Europe run in full. Pull requests into main, pushes and dispatches run
  # everything, so main only takes fully checked commits; e2e-nightly.yml runs
  # everything on develop each night.
  e2e:
    name: e2e
    needs: [already-checked, playwright-image]
    if: ${{ !cancelled() && needs.already-checked.outputs.checked != 'true' && needs.playwright-image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      # The runner's user, which owns the workspace; --ipc=host keeps Chromium
      # from running out of shared memory. --add-host: Europe's tests reach
      # europe.localhost through Node too, whose lookup goes to the resolver,
      # and the runner's resolver doesn't always answer *.localhost.
      options: --user 1001 --ipc=host --add-host=europe.localhost:127.0.0.1
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and the base's tip, for the pull request's changes.
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: node scripts/e2e-scope.mjs
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  # Merge commits ("Merge pull request #…", "Merge branch …") are skipped by the
  # config-conventional default ignores, so release and sync PRs need no special case.
  commit-messages:
    name: commit-messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Refuses to deploy a commit older than the live one, e.g. on a re-run of an old
  # run (research R14, contracts/deploy.md). No environment, so a skip records nothing.
  # Runs only after the four checks passed, or were skipped because they already
  # passed on this content (spec FR-024).
  # Which teams this commit deploys to (feature 026 research R13). Each team has its
  # own environment, so each is checked against its own live commit. Europe is
  # only listed while the repository variable EUROPE_DEPLOY is "on", so a merge
  # never creates its Cloudflare resources on its own. `deploy` stays Hamburg's
  # decision, for deploy-gateway.
  deploy-gate:
    name: deploy-gate
    needs: [already-checked, lint, typecheck, test, e2e]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (needs.already-checked.outputs.checked == 'true'
        || (needs.lint.result == 'success' && needs.typecheck.result == 'success' && needs.test.result == 'success' && needs.e2e.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      teams: ${{ steps.decide.outputs.teams }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EUROPE_DEPLOY: ${{ vars.EUROPE_DEPLOY }}
        run: |
          set -euo pipefail

          # One entry per team: its environment, address, database and Wrangler
          # environment (`--env`; the top level holds no team).
          teams='[{"team":"hamburg","environment":"production","url":"https://trhh-rynke-coins.link","database":"rynke-points","wrangler_env":"hamburg"}]'
          if [ "${EUROPE_DEPLOY:-}" = on ]; then
            teams=$(jq -c '. + [{"team":"europe","environment":"production-europe","url":"https://europe.trhh-rynke-coins.link","database":"DB","wrangler_env":"europe"}]' <<< "$teams")
          fi

          # Sets result to true if $GITHUB_SHA should go to environment $1. Not
          # run in a subshell, so its notices reach the log and an error ends the run.
          decide() {
            local environment=$1 deployments live_sha="" id sha state rc
            # Newest first. The first one whose newest status is success is live;
            # older successes are inactive, failed ones failure.
            deployments=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$environment&per_page=100" --jq '.[] | "\(.id) \(.sha)"')
            while read -r id sha; do
              [ -n "$id" ] || continue
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
              if [ "$state" = success ]; then
                live_sha=$sha
                break
              fi
            done <<< "$deployments"

            if [ -z "$live_sha" ]; then
              echo "First deployment to $environment."
              result=true
            elif [ "$live_sha" = "$GITHUB_SHA" ]; then
              echo "Re-deploying the live commit $live_sha to $environment."
              result=true
            elif git merge-base --is-ancestor "$GITHUB_SHA" "$live_sha"; then
              echo "::notice::A newer commit ($live_sha) is already deployed to $environment; skipping $GITHUB_SHA."
              result=false
            else
              # 1 means newer; anything else (e.g. 128, unknown commit) is an error.
              rc=$?
              if [ "$rc" -ne 1 ]; then
                exit "$rc"
              fi
              echo "Deploying $GITHUB_SHA to $environment; live is $live_sha."
              result=true
            fi
          }

          deploy=false
          selected='[]'
          result=false
          while read -r entry; do
            team=$(jq -r .team <<< "$entry")
            environment=$(jq -r .environment <<< "$entry")
            decide "$environment"
            if [ "$result" = true ]; then
              selected=$(jq -c --argjson entry "$entry" '. + [$entry]' <<< "$selected")
              if [ "$team" = hamburg ]; then
                deploy=true
              fi
            fi
          done < <(jq -c '.[]' <<< "$teams")
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "teams=$selected" >> "$GITHUB_OUTPUT"

  # One deploy per team, each on its own (fail-fast off): one team's failure never
  # holds another's. Per team: its placeholders checked, migrations first, then the
  # code; wrangler deploy stays the last step (research R19–R21). The secret is only
  # in the env of the two wrangler steps (R22). !cancelled() instead of the implicit
  # success(), which also counts the checks behind deploy-gate and so skipped the
  # deploy whenever already-checked skipped them.
  deploy:
    name: deploy (${{ matrix.team }})
    needs: deploy-gate
    if: ${{ !cancelled() && needs.deploy-gate.result == 'success' && needs.deploy-gate.outputs.teams != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.deploy-gate.outputs.teams) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ matrix.environment }}
      url: ${{ matrix.url }}
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
      TEAM: ${{ matrix.team }}
      DATABASE: ${{ matrix.database }}
      WRANGLER_ENV: ${{ matrix.wrangler_env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # A team still holding another team's values is never deployed (FR-053).
      - name: Check the team data
        run: node scripts/team-check.mjs --deployable "$TEAM"
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply "$DATABASE" --remote --env "$WRANGLER_ENV"
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env "$WRANGLER_ENV" --message "$GITHUB_SHA (run $GITHUB_RUN_ID)"

  # The Strava gateway (feature 026 release 3, gateway/). Off until the maintainer
  # sets the repository variable GATEWAY_DEPLOY to "on" (docs/gateway-switch.md),
  # so a merge never creates Cloudflare resources on its own. Then on main after
  # the same gate as the team deploy: on a push only when gateway/ or what it
  # imports changed, on a dispatch always. Not a required-check context.
  deploy-gateway:
    name: deploy-gateway
    needs: deploy-gate
    if: ${{ !cancelled() && vars.GATEWAY_DEPLOY == 'on' && needs.deploy-gate.result == 'success' && needs.deploy-gate.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-gateway
    concurrency:
      group: deploy-gateway
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- gateway src/crypto/secret.ts pnpm-lock.yaml; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The gateway didn't change; not deploying it."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.deploy == 'true'
        uses: ./.github/actions/setup
      - name: Deploy the gateway
        if: steps.changed.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config gateway/wrangler.jsonc --message "$GITHUB_SHA (run $GITHUB_RUN_ID)"
