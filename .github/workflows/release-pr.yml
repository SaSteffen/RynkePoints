name: Release PR

# The "Run workflow" button (Actions → Release PR) opens the pull request from
# develop into main, or uses the one already open. A ticked sandbox box deploys
# its head to that sandbox (feature 027, .github/workflows/sandbox.yml).
on:
  workflow_dispatch:
    inputs:
      sandbox-hamburg:
        description: Deploy to Hamburg's sandbox. Skip for docs, specs, tests, CI or tooling only.
        type: boolean
        default: false
      sandbox-europe:
        description: Deploy to Europe's sandbox. Skip for docs, specs, tests, CI or tooling only.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: release-pr
    # The release environment only releases its token to runs on develop.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      # A pull request opened with github.token starts no workflows, so the required
      # checks would never report. RELEASE_PR_TOKEN opens it as the maintainer.
      - id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The pull request's number and head, for the sandboxes.
          found() {
            gh pr view "$1" --repo "$REPO" --json number,headRefOid \
              --jq '"pr=\(.number)\nsha=\(.headRefOid)"' >> "$GITHUB_OUTPUT"
          }

          open=$(gh pr list --repo "$REPO" --base main --head develop --state open --json url --jq '.[0].url // ""')
          if [ -n "$open" ]; then
            echo "::notice::Using the release pull request already open: $open"
            found "$open"
            exit 0
          fi

          ahead=$(gh api "repos/$REPO/compare/main...develop" --jq .ahead_by)
          if [ "$ahead" = 0 ]; then
            echo "::notice::develop has nothing that main lacks."
            exit 0
          fi

          # One line per pull request merged into develop and not yet on main, by title.
          # Branch commits never appear on their own, and sync/* back-merges are left out.
          # Squash commits from before merge commits became the only method still match.
          # Titles reach the body through files, never the shell.
          gh api --paginate "repos/$REPO/compare/main...develop?per_page=100" \
            --jq '.commits[].sha' > "$RUNNER_TEMP/shas.txt"

          limit=500
          gh pr list --repo "$REPO" --base develop --state merged --limit "$limit" \
            --json number,title,mergeCommit,headRefName > "$RUNNER_TEMP/prs.json"

          oldest=$(jq -r '.[-1].mergeCommit.oid // ""' "$RUNNER_TEMP/prs.json")
          if [ "$(jq length "$RUNNER_TEMP/prs.json")" -ge "$limit" ] \
            && grep -qxF "$oldest" "$RUNNER_TEMP/shas.txt"; then
            echo "::warning::This release may reach further back than the newest $limit pull requests, so the description may be missing some."
          fi

          jq -r --rawfile shas "$RUNNER_TEMP/shas.txt" '
            ($shas | split("\n")) as $in
            | .[]
            | select(.mergeCommit.oid as $oid | any($in[]; . == $oid))
            | select(.headRefName | startswith("sync/") | not)
            | "- \(.title) (#\(.number))"
          ' "$RUNNER_TEMP/prs.json" > "$RUNNER_TEMP/body.md"

          # When a sandbox is worth it (feature 027 FR-006, docs/sandboxes.md).
          cat >> "$RUNNER_TEMP/body.md" <<'EOF'

          ## Sandboxes

          **Can be skipped**: only docs, specs, tests, CI or developer tooling changed, or the change
          was already seen working.
          **Worth deploying**: migrations; anything riders see; queue, webhook, cron or rule changes;
          team settings or team data; a large release; or when unsure.
          **Which sandbox**: the team that changed, or any one for changes shared by all teams.
          **What it can't show**: anything needing the real Strava: sign-in, real webhooks, rate limits.
          To deploy later, run **Sandbox** (Actions) on `develop`.
          EOF

          url=$(gh pr create --repo "$REPO" --base main --head develop \
            --title "chore: release" --body-file "$RUNNER_TEMP/body.md")
          echo "::notice::Opened $url"
          found "$url"

  # The ticked sandboxes get the release pull request's head, seeded at main.
  sandbox:
    name: sandbox
    needs: release-pr
    if: >-
      needs.release-pr.outputs.pr != ''
      && (inputs.sandbox-hamburg || inputs.sandbox-europe)
    permissions:
      contents: read
      checks: read
      actions: write
      pull-requests: write
      deployments: write
    uses: ./.github/workflows/sandbox.yml
    # A called workflow sees its environments' secrets only when the caller
    # passes secrets on; sandbox.yml reads them in its named steps only.
    secrets: inherit
    with:
      teams: >-
        ${{ (inputs.sandbox-hamburg && inputs.sandbox-europe) && '["hamburg","europe"]'
        || (inputs.sandbox-hamburg && '["hamburg"]' || '["europe"]') }}
      pr: ${{ needs.release-pr.outputs.pr }}
      sha: ${{ needs.release-pr.outputs.sha }}
      base: main
