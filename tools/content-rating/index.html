<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprüche sichten</title>
<style>
	:root { color-scheme: light dark; --bg: #faf8f2; --fg: #1d1b16; --muted: #6b665a; --card: #fff;
		--line: #e4dfd2; --yellow: #f5c400; --keep: #1f8a4c; --cut: #c0392b; }
	@media (prefers-color-scheme: dark) { :root { --bg: #16150f; --fg: #f1ede2; --muted: #a39e90;
		--card: #22201a; --line: #38352c; } }
	* { box-sizing: border-box; }
	body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
	main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
	h1 { font-size: 20px; margin: 0 0 16px; }
	.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
	select, button, textarea { font: inherit; color: inherit; }
	select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
	.stats { color: var(--muted); font-size: 14px; margin-left: auto; }
	.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
	.progress > div { height: 100%; background: var(--yellow); transition: width .2s; }
	.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px;
		border-left: 6px solid var(--line); }
	.card.keep { border-left-color: var(--keep); } .card.cut { border-left-color: var(--cut); }
	.meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
	.tag { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
	.tag.new { background: var(--yellow); color: #1d1b16; border-color: var(--yellow); font-weight: 600; }
	.quote { font-size: 24px; line-height: 1.4; margin: 0 0 22px; min-height: 3em; }
	.actions { display: flex; gap: 8px; flex-wrap: wrap; }
	.actions button { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line);
		background: transparent; cursor: pointer; }
	.actions .k { border-color: var(--keep); } .actions .c { border-color: var(--cut); }
	.card.keep .k { background: var(--keep); color: #fff; } .card.cut .c { background: var(--cut); color: #fff; }
	textarea { width: 100%; margin-top: 16px; min-height: 64px; padding: 10px; border-radius: 10px;
		border: 1px solid var(--line); background: transparent; resize: vertical; }
	.keys { color: var(--muted); font-size: 13px; margin-top: 16px; }
	kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; }
	.empty { text-align: center; color: var(--muted); padding: 48px 0; }
	.saved { font-size: 13px; color: var(--muted); height: 1.5em; margin-top: 6px; }
</style>
</head>
<body>
<main>
	<h1>Sprüche sichten</h1>
	<div class="bar">
		<select id="list">
			<option value="">Beide Listen</option>
			<option value="push">Braucht Schwung</option>
			<option value="onTrack">Im Plan</option>
		</select>
		<select id="show">
			<option value="open">Nur offene</option>
			<option value="new">Nur neue</option>
			<option value="seasonal">Nur Jahreszeiten</option>
			<option value="recent">Zuletzt entschieden</option>
			<option value="all">Alle</option>
			<option value="keep">Behalten</option>
			<option value="cut">Raus</option>
		</select>
		<span class="stats" id="stats"></span>
	</div>
	<div class="progress"><div id="progress"></div></div>
	<p id="error" hidden style="background: var(--cut); color: #fff; padding: 10px 14px; border-radius: 10px;">
		Nicht gespeichert – der Server antwortet nicht. Seite neu laden, bevor du weitermachst.</p>
	<div id="view"></div>
	<p class="keys">
		<kbd>Y</kbd> behalten · <kbd>N</kbd> raus · <kbd>U</kbd> zurücksetzen ·
		<kbd>←</kbd><kbd>→</kbd> blättern · <kbd>/</kbd> Notiz (z. B. bessere Formulierung) · <kbd>Esc</kbd> Notiz verlassen
	</p>
</main>
<script>
const LIST = { push: "Braucht Schwung", onTrack: "Im Plan" };
let quotes = [], decisions = {}, view = [], index = 0;
const $ = (id) => document.getElementById(id);

async function load() {
	[quotes, decisions] = await Promise.all([
		fetch("/api/quotes").then((r) => r.json()),
		fetch("/api/decisions").then((r) => r.json()),
	]);
	rebuild();
}

function matches(q) {
	const d = decisions[q.text]?.verdict ?? null;
	if ($("list").value && q.list !== $("list").value) return false;
	switch ($("show").value) {
		case "open": return d === null;
		case "new": return q.isNew;
		case "seasonal": return q.seasonal;
		case "recent": return d !== null;
		case "keep": return d === "keep";
		case "cut": return d === "cut";
		default: return true;
	}
}

function rebuild(keepText) {
	view = quotes.filter(matches);
	if ($("show").value === "recent") {
		const order = Object.keys(decisions);
		view.sort((a, b) => order.indexOf(b.text) - order.indexOf(a.text));
	}
	const at = keepText ? view.findIndex((q) => q.text === keepText) : -1;
	index = at >= 0 ? at : Math.min(index, Math.max(view.length - 1, 0));
	render();
}

function render() {
	const scope = quotes.filter((q) => !$("list").value || q.list === $("list").value);
	const done = scope.filter((q) => decisions[q.text]?.verdict).length;
	const kept = scope.filter((q) => decisions[q.text]?.verdict === "keep").length;
	const cut = scope.filter((q) => decisions[q.text]?.verdict === "cut").length;
	$("stats").textContent = `${done}/${scope.length} gesichtet · ${kept} behalten · ${cut} raus`;
	$("progress").style.width = `${scope.length ? (100 * done) / scope.length : 0}%`;
	const q = view[index];
	if (!q) { $("view").innerHTML = `<div class="empty">Nichts mehr offen in dieser Auswahl. 🎉</div>`; return; }
	const d = decisions[q.text] ?? { verdict: null, note: "" };
	$("view").innerHTML = `
		<div class="card ${d.verdict ?? ""}">
			<div class="meta">
				<span>${index + 1} / ${view.length}</span>
				<span class="tag">${LIST[q.list]}</span>
				<span class="tag">${q.seasonal ? "🗓️ nur " : ""}${q.section}</span>
				${q.isNew ? '<span class="tag new">neu</span>' : ""}
			</div>
			<p class="quote" lang="de"></p>
			<div class="actions">
				<button class="k" data-v="keep">✅ Behalten</button>
				<button class="c" data-v="cut">❌ Raus</button>
				<button data-v="">Zurücksetzen</button>
				<button data-move="-1">←</button>
				<button data-move="1">→</button>
			</div>
			<textarea id="note" placeholder="Notiz: warum, oder wie es besser klingt …"></textarea>
			<div class="saved" id="saved"></div>
		</div>`;
	document.querySelector(".quote").textContent = q.text;
	$("note").value = d.note ?? "";
	$("note").addEventListener("input", debounce(() => save(q, decisions[q.text]?.verdict ?? null, $("note").value), 400));
	document.querySelectorAll("[data-v]").forEach((b) => {
		b.onclick = () => decide(b.dataset.v || null);
	});
	document.querySelectorAll("[data-move]").forEach((b) => {
		b.onclick = () => move(+b.dataset.move);
	});
}

async function save(q, verdict, note) {
	delete decisions[q.text];
	if (verdict || note) decisions[q.text] = { verdict, note };
	const ok = await fetch("/api/decisions", { method: "POST", body: JSON.stringify({ text: q.text, verdict, note }) })
		.then((r) => r.ok, () => false);
	$("error").hidden = ok;
	const s = $("saved"); if (s && ok) { s.textContent = "gespeichert"; setTimeout(() => s.textContent = "", 900); }
}

async function decide(verdict) {
	const q = view[index]; if (!q) return;
	await save(q, verdict, $("note").value);
	if ($("show").value === "open" && verdict) rebuild();   // the decided quote leaves the view
	else { if (verdict) index = Math.min(index + 1, view.length - 1); rebuild(view[index]?.text); }
}

function move(step) { index = Math.max(0, Math.min(view.length - 1, index + step)); render(); }
function debounce(fn, ms) { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }

document.addEventListener("keydown", (e) => {
	if (e.target.tagName === "TEXTAREA") { if (e.key === "Escape") e.target.blur(); return; }
	if (e.target.tagName === "SELECT") return;
	const key = e.key.toLowerCase();
	if (key === "y") decide("keep");
	else if (key === "n") decide("cut");
	else if (key === "u") decide(null);
	else if (e.key === "ArrowRight") move(1);
	else if (e.key === "ArrowLeft") move(-1);
	else if (e.key === "/") { e.preventDefault(); $("note")?.focus(); }
});
$("list").onchange = () => { index = 0; rebuild(); };
$("show").onchange = () => { index = 0; rebuild(); };
load();
</script>
</body>
</html>
